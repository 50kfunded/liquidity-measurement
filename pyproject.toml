[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-measurement"
version = "0.1.0"
description = "BTC/USD liquidity measurement with market data quality checks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
liquidity = "liquidity_measurement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
